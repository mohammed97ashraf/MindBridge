[theme]
base            = "dark"
primaryColor    = "#7c3aed"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#0d1220"
textColor       = "#e6edf3"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
